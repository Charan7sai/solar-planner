<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-label="Flow from a click on a roof through imagery, the segmentation model and watershed split to an editable outline. NASA weather data and optional shade feed a PV simulation. The outline and the simulation size the system, which with the bill and subsidy feeds a 25 year cash flow and the results.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .t { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .s { font-size: 12px; fill: #475569; }
      .h { font-size: 12px; font-weight: 700; fill: #475569; text-anchor: start; letter-spacing: 0.06em; }
      .ml { fill: #ffedd5; stroke: #ea580c; }
      .data { fill: #dbeafe; stroke: #2563eb; }
      .calc { fill: #dcfce7; stroke: #16a34a; }
      .out { fill: #c2410c; stroke: #9a3412; }
      rect { stroke-width: 1.5; }
      line { stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="920" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0" style="stroke-width:1"/>

  <text class="h" x="20" y="28">ROOF DETECTION</text>
  <text class="h" x="20" y="136">SOLAR RESOURCE</text>
  <text class="h" x="20" y="244">MONEY</text>

  <rect class="data" x="20" y="38" width="150" height="66" rx="10"/>
  <text class="t" x="95" y="67">Click on a roof</text><text class="s" x="95" y="86">or trace it by hand</text>
  <rect class="data" x="200" y="38" width="150" height="66" rx="10"/>
  <text class="t" x="275" y="67">Satellite imagery</text><text class="s" x="275" y="86">zoom 19, 512 px</text>
  <rect class="ml" x="380" y="38" width="150" height="66" rx="10"/>
  <text class="t" x="455" y="67">ResNet34 UNet</text><text class="s" x="455" y="86">INT8 ONNX on CPU</text>
  <rect class="ml" x="560" y="38" width="150" height="66" rx="10"/>
  <text class="t" x="635" y="67">Watershed split</text><text class="s" x="635" y="86">separates touching roofs</text>
  <rect class="ml" x="740" y="38" width="160" height="66" rx="10"/>
  <text class="t" x="820" y="67">Roof outline, area</text><text class="s" x="820" y="86">editable by the visitor</text>

  <rect class="data" x="20" y="146" width="150" height="66" rx="10"/>
  <text class="t" x="95" y="175">NASA POWER</text><text class="s" x="95" y="194">20 years of weather</text>
  <rect class="data" x="200" y="146" width="150" height="66" rx="10"/>
  <text class="t" x="275" y="175">Optional shade</text><text class="s" x="275" y="194">nearby obstacles</text>
  <rect class="calc" x="380" y="146" width="330" height="66" rx="10"/>
  <text class="t" x="545" y="175">PV simulation for every weather year</text><text class="s" x="545" y="194">typical (P50) and poor year (P90) generation</text>
  <rect class="calc" x="740" y="146" width="160" height="66" rx="10"/>
  <text class="t" x="820" y="175">System sizing</text><text class="s" x="820" y="194">roof vs your use</text>

  <rect class="data" x="20" y="254" width="150" height="66" rx="10"/>
  <text class="t" x="95" y="283">Your bill</text><text class="s" x="95" y="302">use and rate per unit</text>
  <rect class="data" x="200" y="254" width="150" height="66" rx="10"/>
  <text class="t" x="275" y="283">PM Surya Ghar</text><text class="s" x="275" y="302">subsidy up to ₹78,000</text>
  <rect class="calc" x="380" y="254" width="330" height="66" rx="10"/>
  <text class="t" x="545" y="283">25 year cash flow with net metering</text><text class="s" x="545" y="302">degradation, tariff growth, upkeep</text>
  <rect class="out" x="740" y="254" width="160" height="66" rx="10"/>
  <text class="t" x="820" y="283" style="fill:#ffffff">Payback, savings</text><text class="s" x="820" y="302" style="fill:#ffedd5">charts, PDF, share link</text>

  <line x1="170" y1="71" x2="198" y2="71"/>
  <line x1="350" y1="71" x2="378" y2="71"/>
  <line x1="530" y1="71" x2="558" y2="71"/>
  <line x1="710" y1="71" x2="738" y2="71"/>
  <line x1="820" y1="104" x2="820" y2="144"/>

  <path d="M170 179 H185 V132 H360 V168 H378" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="350" y1="179" x2="378" y2="179"/>
  <line x1="710" y1="179" x2="738" y2="179"/>

  <path d="M170 287 H185 V240 H360 V276 H378" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="350" y1="287" x2="378" y2="287"/>
  <path d="M800 212 V233 H600 V252" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="710" y1="287" x2="738" y2="287"/>
</svg>
